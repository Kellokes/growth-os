  <meta name="theme-color" content="#e8ebe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Growth OS{% endblock %}</title>

<body>
{% block body %}{% endblock %}
