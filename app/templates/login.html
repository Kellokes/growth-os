{% extends "base.html" %}
{% block title %}Entrar · Growth OS{% endblock %}
{% block body %}
<main class="login">
  <button class="icon-btn theme-fab" type="button" data-theme-toggle aria-label="Alternar tema"><span class="i-sun">☀</span><span class="i-moon">☾</span></button>
  <form class="card login-card" method="post" action="/login" autocomplete="on">
    <div class="brand"><span class="logo">◆</span> Growth OS</div>
    <p class="muted">Acesso restrito ao owner.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>Usuário<input name="username" autocomplete="username" required autofocus></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <label>Código 2FA<input name="totp" inputmode="numeric" pattern="[0-9 ]{6,8}" autocomplete="one-time-code" required></label>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</main>
{% endblock %}
