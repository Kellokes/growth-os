{% extends "base.html" %}
{% from "_icons.html" import ic %}
{% block title %}Entrar · Growth OS{% endblock %}
{% block body %}
<main class="login">
  <button class="icon-btn theme-fab theme-btn" type="button" data-theme-toggle aria-label="Alternar tema"><span class="i-sun">{{ ic("sun") }}</span><span class="i-moon">{{ ic("moon") }}</span></button>
  <form class="card login-card" method="post" action="/login" autocomplete="on">
    <div class="orb small" aria-hidden="true"><i></i></div>
    <div class="brand"><span class="logo">◆</span><span class="brand-name">Growth OS</span></div>
    <ol class="login-steps" aria-label="Etapa 1 de 2"><li class="on">Senha</li><li>Código 2FA</li></ol>
    <h1 class="login-title">Bem-vindo de volta</h1>
    <p class="muted">Acesso restrito ao owner.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <label>Usuário<input name="username" autocomplete="username" value="{{ username or '' }}" required {% if not username %}autofocus{% endif %}></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}></label>
    <button class="btn primary big" type="submit">Continuar {{ ic("arrow") }}</button>
  </form>
</main>
{% endblock %}
