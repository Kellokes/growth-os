services:
  postgres:
    image: postgres:16-alpine
    container_name: growth-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gos
      POSTGRES_DB: gos
      POSTGRES_PASSWORD: ${GOS_POSTGRES_PASSWORD:?defina GOS_POSTGRES_PASSWORD no .env}
    volumes:
      - gos-pgdata:/var/lib/postgresql/data
    # Sem "ports": o banco só é alcançável pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gos -d gos"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  # Único serviço com o socket do Docker. Só lista containers, lê logs e reinicia (com token).
  docker-gateway:
    build: ./gateway
    container_name: growth-os-docker-gateway
    restart: unless-stopped
    environment:
      GATEWAY_TOKEN: ${GOS_GATEWAY_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Sem "ports": só a rede interna do compose alcança.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64

  growth-os:
    build:
      context: .
      args:
        # Versão que está rodando, para a IA comparar com a main (gos-self info).
        GROWTH_OS_COMMIT: ${GROWTH_OS_COMMIT:-}
    container_name: growth-os
    restart: unless-stopped
    env_file: .env
    environment:
      GOS_DATABASE_URL: postgresql+psycopg://gos:${GOS_POSTGRES_PASSWORD}@postgres:5432/gos
      DOCKER_GATEWAY_URL: http://docker-gateway:2375
    depends_on:
      postgres:
        condition: service_healthy
      docker-gateway:
        condition: service_started
    # Só o Caddy do host enxerga a porta; nada fica exposto direto na internet.
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      # Mantido para o SQLite antigo (migrate-sqlite); pode ser removido depois da migração.
      - gos-data:/data
      - gos-workspace:/workspace
      # Login dos CLIs (claude login / codex login) persiste aqui.
      - gos-home:/home/gos
      # Caddyfile compartilhado do VPS, só leitura (sem a pasta do projeto, que tem .env).
      - type: bind
        source: ${GOS_CADDYFILE_HOST:-/opt/takeone/Caddyfile}
        target: /projects/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    # Endurecimento: sem privilégios extras; o Docker só pelo gateway, nunca o socket.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512

volumes:
  gos-pgdata:
  gos-data:
  gos-workspace:
  gos-home:
