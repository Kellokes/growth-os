[project]
name = "growth-os"
version = "0.1.0"
description = "AI Operating System para empresas digitais"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app", "app.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
